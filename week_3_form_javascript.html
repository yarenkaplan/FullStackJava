<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS5 - Full Stack Java</title>
    <meta name="author" content="Yaren Kaplan" />
    <meta name="keywords" content="html5,css3,js,es5,es6,ts,node,bs5,react" />
    <meta name="description" content="Full Stack Java context" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!--internal css-->
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #253a69, #1e293b);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 45px;
        font-family: Arial, Helvetica, sans-serif;
      }
      .form-card {
        width: 100%;
        max-width: 760px;
        background-color: #382121;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(188, 182, 182, 0.1);
      }
      .form-title {
        color: #f8f9fa;
        font-weight: 600;
        font-size: 28px;
      }
      .form-subtitle {
        color: #9fc0e0;
        font-size: 16px;
      }
      .required {
        color: #e74c3c;
      }
      .form-control:focus,
      .form-select:focus {
        border-color: #007bff;
        box-shadow: 0 2px 4px 0.2rem rgba(0, 123, 255, 0.25);
      }
      .btn-submit,
      .btn-reset {
        background: #0f71da;
        border: none;
        font-weight: 700;
        padding: 8px 24px;
        border-radius: 10px;
      }
      .btn-submit:hover,
      .btn-reset:hover {
        background: black;
        color: white;
        transition: all 1.5 ease;
        transform: rotate(4deg);
      }
      .successBox {
        display: none;
        margin-top: 1rem;
        background: #1f3145;
        color: white;
      }
    </style>
  </head>

  <body>
    <noscript>
      <p>
        This page requires JavaScript. Please enable JavaScript and then reload
        the page.
      </p>
    </noscript>

    <main class="form-card">
      <section id="form_id">
        <div class="text-center mb-4">
          <h2 class="form-title">Education / Consulting Application Form</h2>
          <p class="form-subtitle">Please enter you information</p>
        </div>
      </section>

      <form action="#" method="get" id="applicationForm" novalidate>
        <div class="container">
          <div class="row">
            <div class="col-md-6">
              <label for="name" class="form-label"
                >Name<span class="required">*</span></label
              >
              <input
                type="text"
                class="form-control"
                placeholder="Enter your name"
                required
                title="Enter your name"
              />
            </div>
            <div class="col-md-6">
              <label for="surname" class="form-label"
                >Surname<span class="required">*</span></label
              >
              <input
                type="text"
                class="form-control"
                placeholder="Enter your surname"
                required
                title="Enter your surname"
              />
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label"
                >Email<span class="required">*</span></label
              >
              <input
                type="text"
                class="form-control"
                placeholder="Enter your email"
                required
                title="Enter your email"
              />
              <div class="invalid-feedback">Please enter valid email!</div>
            </div>
            <div class="col-md-6">
                <label for="password" class="form-label"
                  >Password<span class="required">*</span></label
                >
                <input
                  type="password"
                  class="form-control"
                  placeholder="Enter your password"
                  required
                  title="Enter your password"
                />
                <div class="invalid-feedback">Please enter valid email!</div>
              </div>
            <div class="col-md-6">
              <label for="phone" class="form-label"
                >Phone<span class="required">*</span></label
              >
              <input
                type="tel"
                class="form-control"
                placeholder="Enter your phone"
                required
                title="Enter your phone"
              />
              <div class="invalid-feedback">Please enter valid email!</div>
            </div>
            <div class="col-md-6">
              <label for="educationType" class="form-label"
                >Education Type<span class="required">*</span></label
              >
              <select
                name="educationType"
                id="educationType"
                class="form-select"
              >
                <option value="">Please select education type</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="fullstack">Full Stack</option>
                <option value="devops">DevOps</option>
              </select>
              <div class="invalid-feedback">Please select education type!</div>
            </div>
            <div class="col-md-6">
              <label for="experience" class="form-label">
                Experience Level
                <span class="required">*</span>
              </label>
              <select class="form-select" id="experience">
                <option value="">Please select experience level</option>
                <option value="beginner">Beginner</option>
                <option value="middle">Middle</option>
                <option value="advanced">Advanced</option>
              </select>
              <div class="invalid-feedback">
                Please select experience level!
              </div>
            </div>
            <div class="col-md-6">
              <label for="experience" class="form-label">
                Experience Level
                <span class="required">*</span>
              </label>
              <select class="form-select" id="experience">
                <option value="">Please select experience level</option>
                <option value="beginner">Beginner</option>
                <option value="middle">Middle</option>
                <option value="advanced">Advanced</option>
              </select>
              <div class="invalid-feedback">
                Please select experience level!
              </div>
            </div>
            <div class="col-md-6">
              <label for="date" class="form-label"
                >Requested Date<span class="required">*</span></label
              >
              <input type="date" class="form-control" id="date" />
            </div>

            <div class="col-12">
              <label for="message" class="form-label">Explanation</label>
              <textarea
                name="message"
                id="message"
                rows="4"
                class="form-control"
                placeholder="Please enter explanation..."
              ></textarea>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="agreement"
                  required
                />
                <label for="agreement" class="form-check-label"
                  >I accept the Terms and Conditions.<span class="required"
                    >*</span
                  ></label
                >
                <div class="invalid-feedback">Please check the box!</div>
              </div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-submit w-5044">
                Submit
              </button>
              <button type="reset" class="btn btn-secondary btn-reset w-5044">
                Clear
              </button>
            </div>
          </div>
        </div>
      </form>

      <div class="successBox" class="alert alert-success success-box" >
        Form submitted successfully!
      </div>
    </main>

    <script>
        const form = document.getElementById('applicationForm');
        const successBox = document.getElementById('successBox');
        form.addEventListener("submit", function (event) {
            event.preventDefault(); //prevent default submit action, otherwise system default validation applied
            if(!form.checkValidity){
                event.stopPropagation(); //in order to prevent invalid form submit form
                successBox.style.display ="none";
            }else{
                const formData = {
                    name: document.getElementById('name').value.trim(),
                    surname: document.getElementById('surname').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    educationType: document.getElementById('educationType').value.trim(),
                    experience: document.getElementById('experience').value.trim(),
                    date: document.getElementById('message').value.trim(),
                    message: document.getElementById('date').value.trim(),
                    agreement: document.getElementById('agreement').checked
                };
                console.log("Form data: ", formData);
                successBox.style.display = "block";
                form.reset();
                form.classList.remove("was-validated");
            }
            form.classList.add('was-validated');
         } ); //end event listener

    </script>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
